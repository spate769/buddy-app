<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Events – Buddy</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main id="main" class="container page">
  <div class="page-head">
    <div>
      <h1>Events Near You</h1>
      <p>Bigger events are split into small groups of 5 or 6, so you always meet a few people, not a crowd. The best fits for you come first.</p>
    </div>
    <a class="btn btn--secondary mobile-only" href="post.html" id="post-btn">Post an event</a>
  </div>
  <div id="signin-note"></div>
  <div class="filters" role="search" aria-label="Filter events">
    <div class="search">
        <label class="visually-hidden" for="q">Search events</label>
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <input class="input" id="q" type="search" placeholder="Search events, places or activities" autocomplete="off">
      </div>
      <div class="chip-row" id="cats" role="group" aria-label="Event types"></div>
    <div class="filters__row">
      <div class="field">
        <label class="field__label" for="when">When</label>
        <select class="select" id="when"><option value="any">Any day</option><option value="week">Next 7 days</option><option value="weekend">This weekend</option><option value="evening">Evenings</option></select>
      </div>
      <div class="field" id="dist-field">
        <label class="field__label" for="dist">Distance</label>
        <select class="select" id="dist"><option value="any">Any distance</option><option value="2">Within 2 km</option><option value="5">Within 5 km</option><option value="10">Within 10 km</option></select>
      </div>
      <div class="field">
        <label class="field__label" for="sort">Sort by</label>
        <select class="select" id="sort"><option value="fit">Best fit for you</option><option value="soon">Soonest</option><option value="near">Nearest</option></select>
      </div>
      <button type="button" class="chip" id="women" aria-pressed="false"><svg class="ico chip__check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg><span>Women-only</span></button>
    </div>
  </div>
  <div class="results-line">
    <p class="meta" id="count" role="status" aria-live="polite"></p>
    <a href="map.html" class="btn btn--tertiary btn--sm">See these on the map</a>
  </div>
  <ul class="event-grid" id="list"></ul>
  <div class="show-more" id="more-wrap" hidden><button type="button" class="btn btn--secondary" id="more">Show more events</button></div>
  <div id="empty"></div>
</main>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/match.js"></script>
<script src="js/ui.js"></script>
<script src="js/filters.js"></script>
<script src="js/pages/events.js"></script>
</body>
</html>
