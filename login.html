<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in – Buddy</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main id="main" class="container-narrow page">
  <div class="auth">
    <h1>Welcome back</h1>
    <div id="err" class="banner banner--error error-summary" role="alert" tabindex="-1" hidden></div>
    <form id="login" novalidate>
      <div class="field">
        <label class="field__label" for="email">Email</label>
        <input class="input" id="email" name="email" type="email" autocomplete="email" inputmode="email" required>
      </div>
      <div class="field">
        <div class="form-actions--split" style="display:flex;align-items:baseline;gap:1rem">
          <label class="field__label" for="password">Password</label>
          <a href="#" id="forgot" class="meta">Forgot password?</a>
        </div>
        <div class="pw">
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
          <button type="button" class="btn btn--tertiary btn--sm pw__toggle" aria-controls="password" aria-pressed="false">Show</button>
        </div>
      </div>
      <button class="btn btn--primary btn--lg btn--block" type="submit">Log in</button>
    </form>
    <p class="mt">New here? <a href="signup.html">Create your profile</a></p>
    <div class="demo-box">
      <p><strong>Reviewing the prototype?</strong></p>
      <p class="meta">Skip sign-up and use a ready-made profile.</p>
      <button type="button" class="btn btn--secondary" id="demo">Use the demo profile</button>
    </div>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/match.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/login.js"></script>
</body>
</html>
