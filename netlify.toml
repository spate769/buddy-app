# Netlify settings for Buddy. No build step: the site is plain HTML, CSS and JavaScript.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    # Only load code, fonts and styles from this site. Map tiles come from CARTO (OpenStreetMap data).
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.basemaps.cartocdn.com; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
