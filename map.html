<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Map – Buddy</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main id="main" class="container page" style="padding-top:var(--space-5)">
  <div class="page-head">
    <div>
      <h1>Map of events</h1>
      <p>Every pin is a public place. Pick one to see the event.</p>
    </div>
    <a class="btn btn--secondary" href="post.html" id="post-btn">Post an event</a>
  </div>
  <div class="map-layout">
    <div class="map-panel">
      <div class="filters" role="search" aria-label="Filter events">
        <div class="chip-scroll" id="cats" aria-label="Activity"></div>
        <div class="filters__row">
          <div class="field">
            <label class="field__label" for="when">When</label>
            <select class="select" id="when"><option value="any">Any day</option><option value="week">Next 7 days</option><option value="weekend">This weekend</option><option value="evening">Evenings</option></select>
          </div>
          <div class="field" id="dist-field">
            <label class="field__label" for="dist">Distance</label>
            <select class="select" id="dist"><option value="any">Any distance</option><option value="2">Within 2 km</option><option value="5">Within 5 km</option><option value="10">Within 10 km</option></select>
          </div>
          <div class="field" hidden>
            <label class="field__label" for="sort">Sort by</label>
            <select class="select" id="sort"><option value="soon">Soonest</option><option value="fit">Best fit for you</option><option value="near">Nearest</option></select>
          </div>
          <button type="button" class="chip" id="women" aria-pressed="false"><svg class="ico chip__check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg><span>Women-only</span></button>
        </div>
      </div>
      <div class="legend meta" aria-hidden="true"><span><i></i>Open to everyone</span><span><i class="warm"></i>Women-only</span></div>
      <p class="meta" id="count" role="status" aria-live="polite"></p>
      <ul class="map-list" id="list"></ul>
      <div id="empty"></div>
    </div>
    <div class="map-canvas" id="map" role="region" aria-label="Map of event locations in London, Ontario"></div>
  </div>
</main>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/match.js"></script>
<script src="js/ui.js"></script>
<script src="js/filters.js"></script>
<script src="js/pages/map.js"></script>
</body>
</html>
